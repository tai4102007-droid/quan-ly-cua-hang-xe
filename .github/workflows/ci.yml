name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiem tra file .h
        run: make check-headers
      - name: Bien dich
        run: make
      - name: Chay test
        run: make test
